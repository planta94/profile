<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeriScribe — Product User Manuals Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; padding: 40px 20px; line-height: 1.6; }
    .hub-container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { font-size: 26px; margin-bottom: 8px; color: #15803d; }
    p { color: #64748b; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; text-decoration: none; color: inherit; transition: all 0.2s; }
    .card:hover { border-color: #22c55e; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15); transform: translateY(-2px); }
    .card h3 { font-size: 16px; margin-bottom: 6px; }
    .card span { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hub-container">
    <h1>📖 VeriScribe User Manuals Hub</h1>
    <p>Select your language and user role below to view verified, interactive product documentation:</p>
    <div class="grid">
        <a class="card" href="./USER_MANUAL.en-US.html">
          <h3>🌐 en-US — All Roles</h3>
          <span>Combined interactive manual &gt;</span>
        </a>

        <a class="card" href="./en-US/user/USER_MANUAL.html">
          <h3>🌐 en-US — USER</h3>
          <span>Interactive HTML manual &gt;</span>
        </a>
    </div>
  </div>
</body>
</html>
